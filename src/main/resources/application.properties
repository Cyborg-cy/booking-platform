spring.application.name=booking-platform

# Defaults match docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DATABASE_USERNAME:booking_user}
spring.datasource.password=${DATABASE_PASSWORD:booking_password}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
